worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    limit_req_zone $binary_remote_addr zone=resource_zone:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;

    server {
        listen 80;
        server_name _;
        client_max_body_size 2m;

        # Docker's embedded DNS resolves service names once at nginx
        # startup and caches the IP for the life of the worker process — if
        # a backend container is later recreated, nginx keeps proxying to
        # the now-dead IP and every request 502s until nginx restarts.
        # Putting the target in a variable forces re-resolution through
        # this resolver on every request instead.
        resolver 127.0.0.11 valid=10s;
        resolver_timeout 5s;

        location = /verify {
            internal;
            set $gate_upstream http://mcp-oauth-gate:4000;
            proxy_pass $gate_upstream/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
        }

        # MCP OAuth 2.1 discovery (RFC9728 + RFC8414) — must be reachable
        # without a token, since a client fetches these to find out how to
        # get one in the first place.
        location = /.well-known/oauth-protected-resource {
            set $gate_upstream http://mcp-oauth-gate:4000;
            proxy_pass $gate_upstream/.well-known/oauth-protected-resource;
            proxy_set_header Host $host;
        }

        location = /.well-known/oauth-authorization-server {
            set $gate_upstream http://mcp-oauth-gate:4000;
            proxy_pass $gate_upstream/.well-known/oauth-authorization-server;
            proxy_set_header Host $host;
        }

        # The protected resource itself — RESOURCE_URL in .env must match
        # this path (e.g. https://your-domain/mcp).
        location /mcp {
            auth_request /verify;
            auth_request_set $device_name $upstream_http_x_device_name;
            # nginx's auth_request module already forwards a WWW-Authenticate
            # header from the /verify subrequest's 401 onto the client
            # response automatically — setting it again here would duplicate it.

            limit_req zone=resource_zone burst=10 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Device-Name $device_name;
            set $resource_upstream http://protected-service:80;
            proxy_pass $resource_upstream/;
        }

        # Device-code + OAuth 2.1 login flows (issuing tokens) — not behind
        # auth_request, since a client doesn't have a token yet when it
        # starts either flow.
        location /auth/ {
            limit_req zone=auth_zone burst=20 nodelay;
            proxy_set_header Host $host;
            # proxy_pass with a variable target disables nginx's normal
            # "replace the matched location prefix" behavior — it forwards
            # exactly the URI given here, nothing appended. Strip the
            # prefix explicitly with rewrite instead, so proxy_pass (with
            # no URI part) forwards the rewritten $uri.
            set $gate_upstream http://mcp-oauth-gate:4000;
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass $gate_upstream;
        }

        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
