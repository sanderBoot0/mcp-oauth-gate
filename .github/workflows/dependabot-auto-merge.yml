name: Dependabot auto-merge

on:
    pull_request:
        branches: [master]

permissions:
    contents: write
    pull-requests: write

jobs:
    auto-merge:
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest
        steps:
            - name: Fetch Dependabot metadata
              id: metadata
              uses: dependabot/fetch-metadata@v2
              with:
                  github-token: '${{ secrets.GITHUB_TOKEN }}'

            # Major bumps always need a human look. Patch and minor are
            # non-breaking under semver convention, so approve + enable
            # auto-merge — this still waits for the required status checks
            # on master (build-check, smoke-test) before actually merging,
            # it does not skip CI.
            - name: Approve and enable auto-merge for patch/minor updates
              if: |
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
                  steps.metadata.outputs.update-type == 'version-update:semver-minor'
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh pr review --approve "$PR_URL"
                  gh pr merge --auto --squash "$PR_URL"
