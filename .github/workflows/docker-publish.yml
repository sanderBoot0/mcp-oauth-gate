name: Build and publish Docker image

on:
    push:
        branches: [master]
        tags: ['v*.*.*']
    pull_request:
        branches: [master]

jobs:
    build-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run format:check
            - run: pnpm run lint
            - run: pnpm run typecheck
            - run: pnpm run build
            - run: pnpm test

    smoke-test:
        needs: build-check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
                  cache: pnpm
            - run: pnpm install --frozen-lockfile

            - name: Build image
              run: docker build -t sanderboot/mcp-oauth-gate:latest .

            - name: Start the docker-compose quickstart stack
              working-directory: examples/docker-compose
              run: |
                  cat > .env <<'EOF'
                  BASE_URL=http://localhost:8080
                  RESOURCE_URL=http://localhost:8080/mcp
                  UPSTREAM_URL=http://protected-service:80
                  AUTH_PROVIDER=oidc
                  OIDC_ISSUER_URL=https://accounts.google.com
                  CLIENT_ID=ci-test-client
                  CLIENT_SECRET=ci-test-secret
                  ALLOWED_EMAILS=test@example.com
                  EOF
                  docker compose up -d
                  timeout 30 sh -c 'until curl -sf http://localhost:8080/healthz >/dev/null; do sleep 1; done'

            - name: Run Bruno smoke tests
              run: pnpm run test:smoke

            - name: Dump container logs on failure
              if: failure()
              working-directory: examples/docker-compose
              run: docker compose logs

            - name: Tear down
              if: always()
              working-directory: examples/docker-compose
              run: docker compose down -v

    docker:
        needs: [build-check, smoke-test]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: sanderboot/mcp-oauth-gate
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,prefix=sha-,format=short

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # Docker Hub renders the description standalone, with no base
            # path — README.md's repo-relative links (./docs/..., ./LICENSE.md,
            # etc.) would 404 there, so rewrite them to absolute GitHub blob
            # URLs before syncing rather than pushing the file verbatim.
            - name: Rewrite relative links for Docker Hub
              run: |
                  sed -E 's#\]\(\./#](https://github.com/sanderBoot0/mcp-oauth-gate/blob/master/#g' \
                      README.md > /tmp/dockerhub-readme.md

            - name: Sync Docker Hub repo overview
              uses: peter-evans/dockerhub-description@v4
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
                  repository: sanderboot/mcp-oauth-gate
                  short-description: Self-hostable OAuth 2.1 authorization server, bundled with nginx, for putting real login in front of an MCP server or any HTTP service.
                  readme-filepath: /tmp/dockerhub-readme.md
